{% load static %}<!doctype html>
<html lang="it" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trenord Tracker{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'trains/style.css' %}" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}"><i class="bi bi-train-front me-2"></i>Trenord Tracker</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">In tempo reale</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Linee</a>
          <ul class="dropdown-menu">
            {% for l in lines %}<li><a class="dropdown-item" href="{% url 'line_detail' l.code %}"><span class="line-dot" style="background:{{ l.color }}"></span><strong>{{ l.code }}</strong> <small class="text-muted">{{ l.name }}</small></a></li>{% endfor %}
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<main class="container pb-5">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{% static 'trains/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
